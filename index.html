<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Issue Assistant</title>
  </head>

  <body>
    <main>
      <h1>AI Issue Assistant</h1>
      <label for="repo-url">GitHub 仓库地址</label>
      <input
        id="repo-url"
        type="url"
        placeholder="https://github.com/owner/repo"
      />
      <button id="load-issues" type="button">Load Issues</button>
      <ul id="issue-list"></ul>
    </main>
  <script src="./app.js"></script>
  </body>
</html>
